repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
          - id: check-toml
          # Copier leaves inline conflict markers in a sync PR it couldn't merge
          # (dev-standards' sync.py). --assume-in-merge makes the hook check every file
          # even outside a git merge, so CI stays red on markers in any file, not only
          # the ones check-yaml parses.
          - id: check-merge-conflict
            args: [--assume-in-merge]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.5
      hooks:
          - id: ruff
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.4.1
      hooks:
          - id: mypy
            additional_dependencies:
                ["types-requests", "types-tqdm>=4.70.0.20261106", "numpy>=2.5.5", "pytest"]
