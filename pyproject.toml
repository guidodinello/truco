[project]
name = "truco"
version = "0.1.0"
description = "Truco Uruguayo Probability Simulator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "matplotlib>=3.11.2",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "types-tqdm>=4.70.0.20260906",
]

[project.scripts]
truco = "truco.main:main"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["truco"]

[tool.ruff]
target-version = "py313"
line-length = 88
select = ["E", "F", "B", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
